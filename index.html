<html lang="zh">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .card {
            background: #1e293b;
            color: #f1f5f9;
            max-width: 520px;
            width: 100%;
            padding: 32px 24px;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            text-align: center;
        }
        .title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .sub {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            background: #0f172a;
            padding: 16px 20px;
            border-radius: 16px;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .stats span {
            color: #94a3b8;
        }
        .stats strong {
            color: #facc15;
            font-size: 20px;
            display: block;
        }
        .question {
            background: #0f172a;
            padding: 32px 16px;
            border-radius: 20px;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 20px;
            font-variant-numeric: tabular-nums;
        }
        .input-area {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .input-area input {
            flex: 1;
            padding: 14px 16px;
            border: none;
            border-radius: 16px;
            background: #0f172a;
            color: #f1f5f9;
            font-size: 24px;
            text-align: center;
            outline: 2px solid transparent;
            transition: 0.2s;
            font-variant-numeric: tabular-nums;
        }
        .input-area input:focus {
            outline-color: #facc15;
        }
        .input-area input:disabled {
            opacity: 0.4;
        }
        .input-area button {
            padding: 14px 24px;
            border: none;
            border-radius: 16px;
            background: #facc15;
            color: #0f172a;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .input-area button:hover:not(:disabled) {
            background: #fde047;
            transform: scale(1.02);
        }
        .input-area button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .feedback {
            min-height: 28px;
            font-size: 16px;
            margin-bottom: 16px;
        }
        .feedback.correct {
            color: #4ade80;
        }
        .feedback.wrong {
            color: #f87171;
        }
        .btn-main {
            background: transparent;
            border: 1px solid #475569;
            color: #94a3b8;
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: 0.2s;
            margin-top: 8px;
        }
        .btn-main:hover {
            background: #334155;
            color: #f1f5f9;
        }
        .btn-main.active {
            border-color: #facc15;
            color: #facc15;
        }
        .result {
            background: #0f172a;
            padding: 20px;
            border-radius: 16px;
            margin-top: 16px;
            display: none;
        }
        .result.show {
            display: block;
        }
        .result .big {
            font-size: 32px;
            font-weight: 700;
            color: #facc15;
        }
        .result .label {
            color: #94a3b8;
            font-size: 14px;
        }
        .leaderboard {
            margin-top: 20px;
            background: #0f172a;
            border-radius: 16px;
            padding: 16px;
            text-align: left;
        }
        .leaderboard h3 {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 12px;
            text-align: center;
        }
        .leaderboard ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .leaderboard li {
            padding: 6px 12px;
            border-bottom: 1px solid #1e293b;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            color: #cbd5e1;
        }
        .leaderboard li:last-child {
            border-bottom: none;
        }
        .leaderboard .rank {
            color: #facc15;
            font-weight: 600;
        }
        .leaderboard .score {
            color: #4ade80;
            font-weight: 600;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #475569;
        }
        .name-input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            justify-content: center;
            align-items: center;
        }
        .name-input-area input {
            padding: 8px 14px;
            border: none;
            border-radius: 12px;
            background: #0f172a;
            color: #f1f5f9;
            font-size: 16px;
            width: 160px;
            text-align: center;
            outline: 2px solid transparent;
            transition: 0.2s;
        }
        .name-input-area input:focus {
            outline-color: #facc15;
        }
        .name-input-area input:disabled {
            opacity: 0.4;
        }
        .name-input-area label {
            color: #94a3b8;
            font-size: 14px;
        }
    </style>
</head>

    // ⚠️ 警告：这里目前是空的！你需要把完整数据填进来。
    // 用你的 Python 脚本导出 JSON，然后转换成 JS 对象粘贴到这里。
    // 如果没有完整数据，系统会使用简化估算（不影响排行榜功能测试）。
    function buildLookup() {
        // 示例数据（仅演示，实际运行时请替换为完整 8100 条）
        const sample = [
            [10, 10, 0],
            [10, 11, 0],
            [10, 12, 0],
            [11, 11, 1],
            [12, 12, 1],
            [77, 78, 12],
            [78, 77, 12],
            [99, 99, 10],
            [99, 98, 10]
        ];
        for (const [a, b, p] of sample) {
            P_LOOKUP[`${a}_${b}`] = p;
        }
        console.log('✅ P 值条目数:', Object.keys(P_LOOKUP).length);
    }
    buildLookup();

    function getP(a, b) {
        let key = `${a}_${b}`;
        if (P_LOOKUP[key] !== undefined) return P_LOOKUP[key];
        key = `${b}_${a}`;
        if (P_LOOKUP[key] !== undefined) return P_LOOKUP[key];
        // 估算（保证程序可运行）
        return Math.min(10, Math.floor((a % 10 + b % 10 + Math.floor(a / 10) + Math.floor(b / 10)) / 2));
    }

    // ============================================================
    // 3. 🎮 游戏状态
    // ============================================================
    const state = {
        running: false,
        totalP: 0,
        correct: 0,
        timeLeft: 60,
        timerId: null,
        currentQuestion: null,
        currentAnswer: 0,
        currentP: 0,
        finished: false,
        finalRate: 0
    };

    const questionEl = document.getElementById('questionDisplay');
    const answerInput = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitBtn');
    const mainBtn = document.getElementById('mainBtn');
    const correctDisplay = document.getElementById('correctDisplay');
    const pDisplay = document.getElementById('pDisplay');
    const timerDisplay = document.getElementById('timerDisplay');
    const feedback = document.getElementById('feedback');
    const resultPanel = document.getElementById('resultPanel');
    const finalRate = document.getElementById('finalRate');
    const finalCorrect = document.getElementById('finalCorrect');
    const finalP = document.getElementById('finalP');
    const playerNameInput = document.getElementById('playerName');
    const shareBtn = document.getElementById('shareBtn');
    const rankList = document.getElementById('rankList');

    function updateUI() {
        correctDisplay.textContent = state.correct;
        pDisplay.textContent = state.totalP;
        timerDisplay.textContent = Math.max(0, state.timeLeft);
    }

    function generateQuestion() {
        const a = Math.floor(Math.random() * 90) + 10;
        const b = Math.floor(Math.random() * 90) + 10;
        const p = getP(a, b);
        return { a, b, p, answer: a * b };
    }

    function showQuestion() {
        const q = generateQuestion();
        state.currentQuestion = q;
        state.currentAnswer = q.answer;
        state.currentP = q.p;
        questionEl.textContent = `${q.a} × ${q.b} = ?`;
        answerInput.value = '';
        answerInput.focus();
        feedback.textContent = '';
        feedback.className = 'feedback';
    }

    function handleSubmit() {
        if (!state.running || state.finished) return;
        const val = parseInt(answerInput.value);
        if (isNaN(val)) {
            feedback.textContent = '⚠️ 请输入数字';
            feedback.className = 'feedback wrong';
            return;
        }
        if (val === state.currentAnswer) {
            state.correct++;
            state.totalP += state.currentP;
            feedback.textContent = `✅ 正确！+${state.currentP} P`;
            feedback.className = 'feedback correct';
        } else {
            feedback.textContent = `❌ 错误，正确答案是 ${state.currentAnswer}`;
            feedback.className = 'feedback wrong';
        }
        updateUI();
        if (state.running && !state.finished) {
            setTimeout(showQuestion, 300);
        }
    }

    function startGame() {
        if (state.timerId) {
            clearInterval(state.timerId);
            state.timerId = null;
        }
        state.running = true;
        state.finished = false;
        state.totalP = 0;
        state.correct = 0;
        state.timeLeft = 60;
        state.finalRate = 0;
        resultPanel.classList.remove('show');
        answerInput.disabled = false;
        submitBtn.disabled = false;
        mainBtn.textContent = '⏳ 测试中...';
        mainBtn.disabled = true;
        playerNameInput.disabled = true;
        updateUI();
        showQuestion();

        state.timerId = setInterval(() => {
            state.timeLeft--;
            updateUI();
            if (state.timeLeft <= 0) {
                endGame();
            }
        }, 1000);
    }

    function endGame() {
        state.running = false;
        state.finished = true;
        if (state.timerId) {
            clearInterval(state.timerId);
            state.timerId = null;
        }
        answerInput.disabled = true;
        submitBtn.disabled = true;
        questionEl.textContent = '⏰ 时间到！';
        feedback.textContent = '';
        feedback.className = 'feedback';

        const rate = state.totalP / 60;
        state.finalRate = rate;
        finalRate.textContent = rate.toFixed(2);
        finalCorrect.textContent = state.correct;
        finalP.textContent = state.totalP;
        resultPanel.classList.add('show');

        mainBtn.textContent = '🔄 再测一次';
        mainBtn.disabled = false;
        playerNameInput.disabled = false;
    }

    // ============================================================
    // 4. 📤 排行榜功能（Supabase）
    // ============================================================
    async function uploadScore(name, score) {
        if (!name.trim()) {
            alert('请先输入昵称！');
            return;
        }
        if (score <= 0) {
            alert('分数太低啦，再练练再上传吧！');
            return;
        }
        shareBtn.textContent = '⏳ 上传中...';
        shareBtn.disabled = true;

        try {
            const { error } = await supabase
                .from('scores')
                .insert([{ name: name.trim(), score: score }]);

            if (error) {
                console.error('上传失败:', error);
                alert('上传失败，请重试。错误信息：' + error.message);
            } else {
                alert('✅ 成绩已上传！');
                loadLeaderboard();
            }
        } catch (err) {
            alert('网络错误，请检查网络后重试。');
        } finally {
            shareBtn.textContent = '📤 上传成绩';
            shareBtn.disabled = false;
        }
    }

    async function loadLeaderboard() {
        try {
            const { data, error } = await supabase
                .from('scores')
                .select('name, score')
                .order('score', { ascending: false })
                .limit(10);

            if (error) {
                console.error('拉取排行榜失败:', error);
                rankList.innerHTML = '<li style="text-align:center;color:#f87171;">加载失败，请刷新</li>';
                return;
            }

            if (!data || data.length === 0) {
                rankList.innerHTML = '<li style="text-align:center;color:#475569;">暂无记录，快来挑战！</li>';
                return;
            }

            rankList.innerHTML = data.map((item, i) => `
                    <li>
                        <span><span class="rank">#${i+1}</span> ${item.name}</span>
                        <span class="score">${item.score.toFixed(2)} P/s</span>
                    </li>
                `).join('');
        } catch (err) {
            console.error(err);
            rankList.innerHTML = '<li style="text-align:center;color:#f87171;">加载失败</li>';
        }
    }

    // ============================================================
    // 5. 🎯 事件绑定 & 初始化
    // ============================================================
    submitBtn.addEventListener('click', handleSubmit);
    answerInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleSubmit();
    });

    mainBtn.addEventListener('click', () => {
        startGame();
    });

    shareBtn.addEventListener('click', () => {
        const name = playerNameInput.value || '匿名';
        uploadScore(name, state.finalRate);
    });

    function init() {
        questionEl.textContent = '准备开始';
        answerInput.disabled = true;
        submitBtn.disabled = true;
        mainBtn.textContent = '🚀 开始游戏';
        mainBtn.disabled = false;
        playerNameInput.disabled = false;
        updateUI();
        resultPanel.classList.remove('show');
        // 加载排行榜
        loadLeaderboard();
    }

    // 页面加载后初始化
    init();
</script>
